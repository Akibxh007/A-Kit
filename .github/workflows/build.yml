name: Build & Release A-Kit APK

on:
  push:
    branches: [ main, master ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate Debug Keystore
        run: keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Prepare Release APK
        run: |
          VERSION_NAME=${GITHUB_REF_NAME:-v1.1.0}
          if [[ "$VERSION_NAME" == "main" || "$VERSION_NAME" == "master" ]]; then VERSION_NAME="v1.1.0"; fi
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk "release-apk/A-Kit-${VERSION_NAME}.apk"

      - name: Upload A-Kit APK
        uses: actions/upload-artifact@v4
        with:
          name: A-Kit-Debug-APK
          path: release-apk/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1.0' }}
          name: "A-Kit ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1.0' }}"
          body: |
            ### A-Kit — Offline Native Utility Suite
            - **100% Offline & Zero Ads:** No internet permission, no trackers.
            - **Live Power & Charging AOD:** Real-time wattage, dual-cell (2S) calibration, battery temperature, and AMOLED Always-On Display.
            - **SnapClean:** Smart screenshot auto-cleaner.
            - **Drop Wi-Fi Share:** High-speed local P2P & offline hotspot file/text sharing with live progress tracking.
          files: release-apk/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
