name: Build & Release A-Kit APK

on:
  push:
    branches: [ main, master ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate Debug Keystore
        run: keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Prepare Release APK
        run: |
          VERSION_NAME=${GITHUB_REF_NAME:-v1.5.1}
          if [[ "$VERSION_NAME" == "main" || "$VERSION_NAME" == "master" ]]; then VERSION_NAME="v1.5.1"; fi
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk "release-apk/A-Kit-${VERSION_NAME}.apk"

      - name: Upload A-Kit APK
        uses: actions/upload-artifact@v4
        with:
          name: A-Kit-Debug-APK
          path: release-apk/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.5.1' }}
          name: "A-Kit ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.5.1' }}"
          body: |
            ### A-Kit v1.5.1 — Play Protect Clean Build, Instant Startup & AmpereFlow Motion
            - **Play Protect Safe Permissions & Updater:** Removed `REQUEST_INSTALL_PACKAGES`, `MANAGE_EXTERNAL_STORAGE`, and APK `FileProvider`; refactored SnapClean to scoped `MediaStore` and switched the GitHub Release updater to clean browser-assisted APK download.
            - **Atomic / Orbital Swirl Gauge Polish:** Removed the extra static inner circle so only rotating elliptical orbital paths surround the centered battery percentage.
            - **Zero-Delay Cold Start & Splash Motion:** Added `androidx.core:core-splashscreen` (`#000000` AMOLED background), async post-frame initialization, a branded spring splash overlay, and staggered Power dashboard entrance + gauge sweep animations.
          files: release-apk/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
