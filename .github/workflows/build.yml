name: Build & Release A-Kit APK

on:
  push:
    branches: [ main, master ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate Debug Keystore
        run: keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Prepare Release APK
        run: |
          VERSION_NAME=${GITHUB_REF_NAME:-v1.5.0}
          if [[ "$VERSION_NAME" == "main" || "$VERSION_NAME" == "master" ]]; then VERSION_NAME="v1.5.0"; fi
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk "release-apk/A-Kit-${VERSION_NAME}.apk"

      - name: Upload A-Kit APK
        uses: actions/upload-artifact@v4
        with:
          name: A-Kit-Debug-APK
          path: release-apk/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.5.0' }}
          name: "A-Kit ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.5.0' }}"
          body: |
            ### A-Kit v1.5.0 — Rate-Limit-Proof In-App Updater & Polish
            - **Zero-Rate-Limit Update Checker:** Added mandatory GitHub REST API headers (`User-Agent`, `Accept`, `X-GitHub-Api-Version`) plus automatic fallback to GitHub's public `releases.atom` feed and direct APK asset resolution so HTTP 403 rate limits never block updates.
            - **Direct APK Download & Install:** Downloads updates into app external Downloads with live progress, smooth Unknown Sources permission handling, and `FileProvider` package installation.
            - **Power Telemetry, Design Studio, SnapClean & Drop:** All v1.4.0 modules preserved intact.
          files: release-apk/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
