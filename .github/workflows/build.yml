name: Build & Release A-Kit APK

on:
  push:
    branches: [ main, master ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate Debug Keystore
        run: keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Prepare Release APK
        run: |
          VERSION_NAME=${GITHUB_REF_NAME:-v1.4.0}
          if [[ "$VERSION_NAME" == "main" || "$VERSION_NAME" == "master" ]]; then VERSION_NAME="v1.4.0"; fi
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk "release-apk/A-Kit-${VERSION_NAME}.apk"

      - name: Upload A-Kit APK
        uses: actions/upload-artifact@v4
        with:
          name: A-Kit-Debug-APK
          path: release-apk/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.4.0' }}
          name: "A-Kit ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.4.0' }}"
          body: |
            ### A-Kit v1.4.0 — AmpereFlow-Grade Design Studio & Smoothed Thermal Telemetry
            - **Smoothed Thermal & Speed Profile:** EMA-filtered rolling window chart with fluid cubic Bezier curves, subtle gradient fills, glowing live tips, and clean MAX/MIN bounds.
            - **AmpereFlow Design Studio & AOD Engine:** Interactive live AMOLED phone mockup preview, 6 clock styles (including Editorial High-Contrast Serif), 12 custom Canvas speedometer styles, 4 battery details layouts, 10 color swatches + brightness slider, media/notification AOD widgets, and full schedule/dim/burn-in behavior controls.
            - **SnapClean, Drop Offline Hotspot & GitHub In-App Updater:** Preserved and refined.
          files: release-apk/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
