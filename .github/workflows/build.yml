name: Build & Release A-Kit Signed APK

on:
  push:
    branches: [ main, master ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode PKCS#12 Release Signing Key
        run: |
          if [ -z "${{ secrets.SIGNING_KEY }}" ]; then
            echo "ERROR: SIGNING_KEY secret is not configured in GitHub repository secrets."
            exit 1
          fi
          echo "${{ secrets.SIGNING_KEY }}" | tr -d '\n\r ' | base64 -d > app/release.p12

      - name: Build Signed Release APK
        env:
          KEYSTORE_FILE: app/release.p12
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease
          else
            gradle assembleRelease
          fi

      - name: Clean up Release Keystore
        if: always()
        run: rm -f app/release.p12

      - name: Prepare Signed Release APK
        run: |
          VERSION_NAME=${GITHUB_REF_NAME:-v1.5.4}
          if [[ "$VERSION_NAME" == "main" || "$VERSION_NAME" == "master" ]]; then VERSION_NAME="v1.5.4"; fi
          mkdir -p release-apk
          cp app/build/outputs/apk/release/app-release.apk "release-apk/A-Kit-${VERSION_NAME}.apk"

      - name: Upload A-Kit Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: A-Kit-Release-APK
          path: release-apk/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.5.4' }}
          name: "A-Kit ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.5.4' }}"
          body: |
            ### A-Kit v1.5.4 — Direct In-App APK Installer Fix & Vintage Decorative Serif Clock
            - **Direct In-App APK Installation:** Restored `REQUEST_INSTALL_PACKAGES`, added `FileProvider` (`file_paths.xml`), and added one-tap `canRequestPackageInstalls()` permission guidance so tapping **Install APK** launches Android's Package Installer cleanly on Android 8–15 & HyperOS.
            - **Ornate Vintage Decorative Serif Clock:** Upgraded Editorial Decorative Serif to bundled high-contrast **Abril Fatface** (`88.sp`, tight `-2.sp` tracking) with `16.sp` Medium sans-serif date subtitle and crisp `26%` / `DISCHARGING` Double-Ring Neon Cyan (`#00E5FF`) gauge styling.
            - **Signed Release Pipeline (PKCS#12):** Built and signed as `A-Kit-v1.5.4.apk` for consistent in-place updates.
          files: release-apk/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
